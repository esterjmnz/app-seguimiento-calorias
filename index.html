<style>

<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const num=s=>parseFloat(String(s).replace(",","."));
const fmt=n=>Math.round(n).toLocaleString("es-ES");
const f2=n=>(Math.round(n*100)/100).toLocaleString("es-ES",{maximumFractionDigits:2});
const f1=n=>(Math.round(n*10)/10).toLocaleString("es-ES");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toLocaleDateString("sv");
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString("sv")};
const ALIAS={fuerza:["pesas","gimnasio"],cardio:["eliptica","spinning"],caminar:["camin","paseo"],correr:["corr","running"],ciclismo:["cicl","bici"],"natación":["nata","piscina"]};
let uid=null,D={foods:{},acts:{},log:[],weights:[],prof:{h:"",a:"",s:"m"},stepK:0.04};

async function login(up){
 const e=$("#em").value.trim(),p=$("#pw0").value;$("#aerr").textContent="";
 const{data,error}=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
 if(error){$("#aerr").textContent=error.message;return}
 if(!data.session){$("#aerr").textContent="Revisa tu email para confirmar la cuenta.";return}
 start(data.session.user)}
async function start(u){uid=u.id;await load();if(!consentOk()){pideConsent();return}mostrarApp()}
function mostrarApp(){$("#cons").style.display="none";$("#auth").style.display="none";$("#app").style.display="flex";iniciaDictado();draw();renderMenu();tab(4)}
sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)});
async function logout(){await sb.auth.signOut();location.reload()}

async function load(){
 const s=daysAgo(90),q=await Promise.all([sb.from("foods").select("*"),sb.from("activities").select("*"),sb.from("food_log").select("*").gte("day",s),sb.from("activity_log").select("*").gte("day",s),sb.from("weights").select("*").order("day"),sb.from("profiles").select("*").maybeSingle(),sb.from("descansos").select("day"),sb.from("reglas").select("*"),sb.from("consentimientos").select("*").order("fecha",{ascending:true})]);
 const own=(a,b)=>(a.user_id?1:0)-(b.user_id?1:0);
 D.foods={};D.acts={};
 (q[0].data||[]).sort(own).forEach(r=>D.foods[r.name.toLowerCase()]={id:r.id,k:r.kcal_100g,p:r.portion_g,u:r.portion_name,kp:r.kcal_portion,g:r.grupo,own:!!r.user_id});
 (q[1].data||[]).sort(own).forEach(r=>D.acts[r.name.toLowerCase()]={id:r.id,k:+r.kcal_hour,m:[norm(r.name)].concat(ALIAS[r.name.toLowerCase()]||[])});
 D.log=(q[2].data||[]).map(r=>({id:r.id,d:r.day,t:"food",txt:r.description,kcal:+r.kcal,est:!!r.estimated,g:r.grupo,rc:r.raciones})).concat((q[3].data||[]).map(r=>({id:r.id,d:r.day,t:"act",txt:r.description,kcal:+r.kcal,tp:r.tipo,mn:r.minutos,st:r.steps})));
 D.weights=(q[4].data||[]).map(r=>({d:r.day,w:+r.kg}));D.desc=new Set((q[6].data||[]).map(r=>r.day));D.reglas=q[7].data||[];D.consent={};(q[8].data||[]).forEach(r=>{D.consent[r.tipo]=r});
 const p=q[5].data||{};D.prof={h:p.height_cm??"",a:p.age??"",s:p.sex||"m"};D.stepK=+(p.step_kcal||0.075);D.goal=p.goal_kcal!=null?+p.goal_kcal:null;D.basal=+p.basal_kcal||null;D.def=p.deficit_kcal!=null?+p.deficit_kcal:null;D.defw=p.deficit_week_kcal!=null?+p.deficit_week_kcal:null;D.wgoal=p.weight_goal!=null?+p.weight_goal:null;D.name=p.name||"";D.modoDesde=p.modo_desde||"";D.creado=p.creado_en||"";D.modo=p.goal_mode||"";D.nivel=PERFIL_UNICO?"autonomo":(p.modo||"");D.subidaOf=!!p.subida_ofrecida;D.tono=p.tono||"";D.motivo=p.motivo||"";D.cuest=p.cuestionario||{};D.riesgo=!!p.riesgo_bienestar}

const unitK=f=>f.k!=null?f.k*(f.p||100)/100:(f.kp||0);
const palabras=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w&&!STOP.has(w));
function findFood(n){const w=palabras(n);let b=null,bs=0;for(const name in D.foods){const t=palabras(name).map(x=>x.replace(/(es|s)$/,""));if(!t.length)continue;if(t.every(x=>w.some(y=>y.startsWith(x)))){const sc=t.length*100+t.join("").length;if(sc>bs){bs=sc;b=name}}}return b}
function findAct(n){for(const a in D.acts)for(const m of D.acts[a].m)if(new RegExp("(^|[^a-z])"+m).test(n))return a;return null}
function cut(t,re){const m=re.exec(norm(t));if(!m)return[null,t];return[m,t.slice(0,m.index)+" "+t.slice(m.index+m[0].length)]}
const QW={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,medio:.5,media:.5};
const STOP=new Set("he comido comi desayune almorce cene tome bebi de del la el los las unos unas son es tiene tienen para con hoy y plato platos racion raciones vaso vasos pieza piezas lata latas loncha lonchas por cada mi en dia a comer cenar desayunar almorzar tomar pensando estoy voy podria puedo quiero apetece que creo eran era tengo aproximadamente otro otra otros otras mas menos copa copas cana canas cucharada cucharadas cucharadita cucharaditas porcion porciones trozo trozos pequeno pequena pequenos pequenas chico chica grande grandes gran normal mediano mediana me te se nos tomado bebido cenado desayunado almorzado comiendo tomando".split(" "));
function parseFood(raw){
 let t=raw.toLowerCase(),per,kc,gr;
 [per,t]=cut(t,/(por|cada|\/)\s*100\s*(g|gr|gramos|ml)\b/);
 [kc,t]=cut(t,/(\d+(?:[.,]\d+)?)\s*(kcal|calorias|cal)\b/);
 [gr,t]=cut(t,/(\d+(?:[.,]\d+)?)\s*(g|gr|grs|gramos|ml)\b/);
 const toks=t.replace(/[^\p{L}\p{N}.,\s]/gu," ").split(/\s+/).map(x=>x.replace(/[.,]+$/,"")).filter(Boolean);
 let q=1;const qi=toks.findIndex(x=>QW[norm(x)]!=null||/^\d+([.,]\d+)?$/.test(x));
 if(qi>=0){q=QW[norm(toks[qi])]??num(toks[qi]);toks.splice(qi,1)}
 let tam=1,por=null;const ti=toks.findIndex(x=>TAM[norm(x)]);if(ti>=0){por=TAM[norm(toks[ti])][0];tam=TAM[norm(toks[ti])][1];toks.splice(ti,1)}
 const nm=toks.filter(x=>!STOP.has(norm(x))).join(" ");
 const name=kc?(nm||findFood(norm(raw))):(findFood(norm(raw))||nm);
 if(!name)return{err:"No he entendido qué alimento es."};
 let f=D.foods[name],total,desc,learned=false,rac=q*tam;
 if(kc){
  const K=num(kc[1]),G=gr?num(gr[1]):null;
  if(!f||!f.own){f=D.foods[name]={...(f||{k:null,p:null,u:"ración",kp:null}),id:null,own:true};learned=true}
  if(per){f.k=K;if(!f.p)f.p=100;total=K*(G??f.p*q)/100;desc=(G?G+" g":q+" ud.")+" de "+name}
  else if(G){f.k=K/G*100;f.p=G;total=K;desc=G+" g de "+name}
  else{f.kp=K;total=K*q;desc=q+" × "+name;if(f.k!=null&&f.p)f.k=K/f.p*100}
 }else{
  if(!f)return{unknown:true,name,q,G:gr?num(gr[1]):null,tam,por};
  if(gr&&f.k!=null){const G=num(gr[1]);total=f.k*G/100;desc=G+" g de "+name;rac=f.p?G/f.p:1}
  else{total=unitK(f)*q*tam;desc=(q!==1?q+" × ":"1 ")+(f.u||"ración")+" de "+name+(por?" · porción "+TAMN[por]:"")+(f.p?" (~"+Math.round(f.p*q*tam)+" g)":"")}
 }
 return{kcal:total,desc,learned,name,f,save:!!kc,grupo:(f&&f.g)||null,porcion:por,raciones:rac};
}
async function saveFood(f,name,src){
 const r={name,kcal_100g:f.k,portion_g:f.p,portion_name:f.u||"ración",kcal_portion:f.kp,grupo:f.g||null,source:src||"chat"};
 if(f.id)await sb.from("foods").update(r).eq("id",f.id);
 else{const{data}=await sb.from("foods").insert({...r,user_id:uid}).select().single();if(data)f.id=data.id}}
const lastW=()=>D.weights.length?D.weights[D.weights.length-1].w:0;
function bmr(){if(D.basal)return D.basal;const p=D.prof,w=lastW();if(!w||!p.h||!p.a)return 0;return 10*w+6.25*num(p.h)-5*num(p.a)+(p.s==="m"?5:-161)}
function day(d){let i=0,a=0;D.log.forEach(e=>{if(e.d===d&&!PEND.has(e.t+":"+e.id)){if(e.t==="food")i+=e.kcal;else a+=e.kcal}});const b=bmr();return{i,a,b,out:b+a,bal:i-b-a}}
async function add(t,txt,kcal,steps,dia,est,ex){
 const row={description:txt,kcal,day:dia||today()};if(steps)row.steps=steps;if(est)row.estimated=true;if(ex)Object.assign(row,ex);
 const{data,error}=await sb.from(t==="food"?"food_log":"activity_log").insert(row).select().single();
 if(error)throw error;D.log.push({id:data.id,d:data.day,t,txt,kcal,est:!!est,g:ex&&ex.grupo,rc:ex&&ex.raciones,tp:ex&&ex.tipo,mn:ex&&ex.minutos,st:steps})}
async function addW(kg,dia){
 const d=dia||today(),{error}=await sb.from("weights").upsert({day:d,kg},{onConflict:"user_id,day"});if(error)throw error;
 D.weights=D.weights.filter(x=>x.d!==d);D.weights.push({d,w:kg});D.weights.sort((a,b)=>a.d<b.d?-1:1)}
const SPLIT=/\s*(?:,(?!\d)|;|\sy\s|\+|\scon\s+(?=(?:(?:otros?|otras?|unos?|unas?)\s+)?\d))\s*/;
const DELV=/\b(quita|quitame|quitar|quitalo|elimina|eliminar|eliminalo|borra|borrame|borrar|borralo|anula|anular|cancela|cancelar|deshaz|deshacer)\b/;
const DSTOP=new Set("el la los las lo de del que he hemos puesto comido comi tome bebi por favor mi me un una ultimo ultima registro registrado entrada y".split(" "));
async function quitar(n,dia){
 const words=n.replace(DELV," ").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w&&!DSTOP.has(w));
 const hoyL=D.log.filter(e=>e.d===dia).reverse();
 if(!hoyL.length)return"No hay nada registrado ese día que quitar.";
 const ws=words.map(w=>w.replace(/(es|s)$/,"")).filter(w=>w.length>1);
 const e=ws.length?(hoyL.find(x=>ws.every(w=>norm(x.txt).includes(w)))||hoyL.find(x=>ws.some(w=>norm(x.txt).includes(w)))):hoyL[0];
 if(!e)return"No he encontrado «"+words.join(" ")+"» en ese día.";
 await sb.from(e.t==="food"?"food_log":"activity_log").delete().eq("id",e.id);
 D.log=D.log.filter(x=>!(x.t===e.t&&x.id===e.id));
 return"Quitado: "+e.txt+" ("+kc(e.kcal)+" kcal).";
}
function fragmentos(s){
 const KC=/\d\s*(kcal|calorias?|cal)\b/,out=[];
 for(const x of s.split(SPLIT).filter(y=>y.trim())){
  const n=norm(x),p=out.length?norm(out[out.length-1]):"";
  const suelto=/^\s*\d+([.,]\d+)?\s*(kcal|calorias?|cal)\s*$/.test(n);
  if(out.length&&(/(gast|quem|consum)/.test(n)||suelto)&&KC.test(n)&&/(ejercicio|hora|min|entren|\bhice\b|\bhecho\b)/.test(p)&&!KC.test(p))out[out.length-1]+=" "+x;
  else out.push(x)}
 return out}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DSEM=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
const iso=d=>d.toLocaleDateString("sv");
function explicita(d,mes,anio){const x=new Date();x.setHours(12,0,0,0);x.setFullYear(anio||x.getFullYear(),mes,d);if(!anio&&x>new Date())x.setFullYear(x.getFullYear()-1);return iso(x)}
function fecha(t){
 let m,r;const h0=new Date();h0.setHours(12,0,0,0);
 const rel=n=>{const d=new Date(h0);d.setDate(d.getDate()-n);return iso(d)};
 [m,r]=cut(t,/\bhoy\b/);if(m)return[rel(0),r];
 [m,r]=cut(t,/\b(anteayer|antes de ayer)\b/);if(m)return[rel(2),r];
 [m,r]=cut(t,/\b(ayer|anoche)\b/);if(m)return[rel(1),r];

function dias28(){let n=0;for(let k=0;k<28;k++)if(hayReg(daysAgo(k)))n++;return n}
function constanteMes(){for(let w=0;w<4;w++){let c=0;for(let k=w*7;k<w*7+7;k++)if(hayReg(daysAgo(k)))c++;if(c<3)return false}return true}

function pesoCamino(){const w=D.weights;if(!w.length)return"Registra tu peso para ver cómo evoluciona.";if(w.length<2)return"Peso actual: <b>"+f2(w[0].w)+" kg</b>.";

const sumaDias=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return iso(x)};
function inicioSemana(d){const x=new Date(d+"T12:00");x.setDate(x.getDate()-(x.getDay()-INICIO_SEMANA+7)%7);return iso(x)}

// Lee un registro de actividad: pasos, o ejercicio con tipo y minutos (usa las columnas nuevas o, si faltan, el texto "fuerza 1 h")
function detAct(e){const m=/^([\d.]+) pasos$/.exec(e.txt);
 if(e.tp==="pasos"||m||e.st)return{paso:true,pasos:+e.st||(m?parseInt(m[1].replace(/\./g,"")):0)};
 const r=/^(.+?) ([\d.,]+) h$/.exec(e.txt);
 return{paso:false,tipo:e.tp||(r?r[1]:e.txt),min:e.mn!=null?+e.mn:(r?Math.round(num(r[2])*60):null)}}
// Estado de un día: dep (deporte) > desc (descanso marcado) > lig (ligera o pasos cumplidos) > nada
function infoDia(d){const A=D.log.filter(e=>e.d===d&&e.t==="act"&&!PEND.has("act:"+e.id)).map(detAct);let pasos=0;const ej=[];
 A.forEach(a=>{if(a.paso)pasos+=a.pasos;else ej.push(a)});
 const fuerte=ej.filter(a=>!(LIG.includes(norm(a.tipo))||(a.min!=null&&a.min<20))),desc=!!(D.desc&&D.desc.has(d));
 return{ej,pasos,desc,estado:fuerte.length?"dep":desc?"desc":(ej.length||pasos>=PASOS_OBJ)?"lig":"nada"}}
// Si el mes es antiguo (fuera de los 90 días cargados), pide sus actividades a la base de datos
async function cargaMes(ym){if(CARGM.has(ym))return;CARGM.add(ym);const a=ym+"-01",b=iso(new Date(+ym.slice(0,4),+ym.slice(5,7),0));if(a>=daysAgo(90))return;
 const{data}=await sb.from("activity_log").select("*").gte("day",a).lte("day",b);
 (data||[]).forEach(r=>{if(!D.log.some(e=>e.t==="act"&&e.id===r.id))D.log.push({id:r.id,d:r.day,t:"act",txt:r.description,kcal:+r.kcal,tp:r.tipo,mn:r.minutos,st:r.steps})})}
async function calMes(n){const[y,m]=CALM.split("-").map(Number),d=new Date(y,m-1+n,1);CALM=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");await cargaMes(CALM);calendario()}

// ---------- REGLAS Y RECOMENDACIONES (tabla "reglas" de Supabase) ----------
// Cada regla: metrica + operador + umbral + ventana_dias (+ grupo) + mensaje + modos + prioridad + activa.
// Métricas disponibles: raciones_grupo (necesita grupo), pasos_medios, dias_deporte, dias_actividad, dias_registro.
const OPS={"<":(a,b)=>a<b,"<=":(a,b)=>a<=b,">":(a,b)=>a>b,">=":(a,b)=>a>=b};
function ventanaDias(n){const L=[];for(let k=1;k<=n;k++)L.push(daysAgo(k));return L}   // los n días COMPLETOS anteriores a hoy
function valorMetrica(r){const W=ventanaDias(r.ventana_dias||7),regs=W.filter(hayReg).length;
 if(regs<Math.min(3,W.length))return null;                     // pocos datos: no opina
 switch(r.metrica){
  case"raciones_grupo":{const dF=W.filter(d=>D.log.some(e=>e.d===d&&e.t==="food")).length;if(dF<Math.min(3,W.length))return null;
   let v=0;D.log.forEach(e=>{if(e.t==="food"&&W.includes(e.d)&&!PEND.has("food:"+e.id)&&(e.g||grupoDe(e.txt))===r.grupo)v+=e.rc||1});return v}
  case"pasos_medios":{let t=0,c=0;W.forEach(d=>{const p=infoDia(d).pasos;if(p){t+=p;c++}});return c>=Math.min(2,W.length)?t/c:null}
  case"dias_deporte":return W.filter(d=>infoDia(d).estado==="dep").length;
  case"dias_actividad":return W.filter(d=>["dep","lig"].includes(infoDia(d).estado)).length;
  case"dias_registro":return regs}
 return null}
function recomendaciones(){const niv=D.nivel||"autonomo",out=[];
 for(const r of (D.reglas||[])){
  if(r.activa===false||(!PERFIL_UNICO&&!(r.modos||[]).includes(niv)))continue;
  if((PERFIL_UNICO||niv==="habitos"||niv==="guiado")&&(r.ventana_dias||7)<3)continue;   // en estos modos, nunca por un solo día
  const f=OPS[r.operador];if(!f)continue;const v=valorMetrica(r);
  if(v!=null&&f(v,+r.umbral))out.push({pr:r.prioridad||5,msg:String(r.mensaje).replace("{valor}",Math.round(v*10)/10).replace("{umbral}",r.umbral)})}
 return out.sort((a,b)=>a.pr-b.pr)}
function recoHtml(max,titulo){const L=recomendaciones();if(!L.length)return"";const m=max?L.slice(0,max):L;
 return(titulo?'<h3>Recomendaciones</h3><div class="card">':'<div class="card" style="margin-top:14px"><b>Una idea para esta semana 💡</b>')+m.map(x=>'<p style="margin:6px 0 0">'+esc(x.msg)+'</p>').join("")+'</div>'}
const recoTxt=()=>{const L=recomendaciones();return L.length?["Ideas para esta semana:"].concat(L.map(x=>"• "+x.msg)).join("\n"):"Ahora mismo no tengo ideas nuevas: ¡lo estás haciendo bien! 🌱 (Las recomendaciones aparecen cuando hay unos días de registro.)"};
